# KURIOSITY KRONICLES: YOUR SINGLE EDITORIAL SETTINGS FILE
# Edit this file on GitHub when you want new interests, priorities or RSS sources.
# Keep indentation as shown (two spaces). Never put API keys here.
# enabled: false turns a topic off for FUTURE collection; old published stories remain.
# priority guides Gemini's choices; keywords are editorial signals, not live web searches.
# sources must be actual RSS/Atom/RDF feeds (Google News RSS search links also work).
# Sources in this file replace collector/sources.txt during GitHub Actions runs.
# A new category appears on your site once Gemini publishes a story in it.

version: 1
editor:
  purpose: >
    A curious Minnesota-based C#/.NET developer and amateur astronomer
    wants clear, useful, surprising science and engineering stories,
    without outrage or manufactured urgency.

    Prioritize curiosity, evidence, explanation, and discovery.
    Favor articles that explore what happened, why it happened,
    how it was observed or established, and what we're learning
    from it.

    Seek substance over sensationalism, acknowledge uncertainty,
    and distinguish established findings from speculation.

  voice: Short, clear, accurate summaries with a lightly witty, nerdy editorial note. Original "from the ...
    dept." lines are welcome. No invented facts or exaggerated certainty.
  avoid:
    - Political outrage and partisan commentary
    - Sensationalism, SEO listicles and misleading clickbait
    - Unfounded speculation presented as confirmed science
    - Tech-industry drama, gossip and repetitive AI marketing
    - Generic daily forecasts and routine forecast bulletins
    - Paywalled coverage when a readable source explains the same finding
topics:
  - name: Astronomy and Space
    enabled: true
    priority: high
    description: Astronomical discoveries, observatories, cosmology, spacecraft, satellites, and planetary
      science.
    keywords:
      - new discovery
      - galaxy
      - planetary science
      - observatory
      - mission results
    avoid: []
    sources:
      - name: NASA Science
        url: https://science.nasa.gov/feed/
      - name: NASA News
        url: https://www.nasa.gov/news-release/feed/
      - name: Universe Today
        url: https://www.universetoday.com/feed
      - name: ESA Space Science
        url: https://www.esa.int/rssfeed/Our_Activities/Space_Science
      - name: Quanta Magazine
        url: https://api.quantamagazine.org/feed/
      - name: Sky and Telescope News
        url: https://www.skyandtelescope.com/astronomy-news/feed/
  - name: Space Weather and Aurora
    enabled: true
    priority: high
    description: Solar flares, CMEs, geomagnetic storms, aurora, satellites and real operational impacts; distinguish
      observed conditions from forecasts.
    keywords:
      - aurora
      - space weather
      - magnetosphere
      - NOAA SWPC
      - satellite effects
    avoid:
      - unsupported severe-storm claims
    sources:
      - name: Google News space weather
        url: https://news.google.com/rss/search?q=%22space+weather%22+OR+%22geomagnetic+storm%22+OR+%22solar+flare%22&hl=en-US&gl=US&ceid=US:en
      - name: Google News aurora
        url: https://news.google.com/rss/search?q=aurora+NOAA+OR+SWPC+OR+satellite+OR+ionosphere&hl=en-US&gl=US&ceid=US:en
      - name: NASA Science
        url: https://science.nasa.gov/feed/
  - name: Astrophotography
    enabled: true
    priority: high
    description: Night-sky photography, smart telescopes, image processing, observing techniques and practical
      equipment discoveries.
    keywords:
      - Siril
      - Seestar
      - astrophotography
      - tracking mounts
      - image processing
    avoid:
      - generic product advertisements
    sources:
      - name: AstroBackyard
        url: https://astrobackyard.com/feed/
        flags:
          - evergreen
      - name: NASA Astronomy Picture of the Day
        url: https://science.nasa.gov/feed/apod-basic/
      - name: Sky and Telescope Observing
        url: https://www.skyandtelescope.com/observing/rss
        flags:
          - evergreen
  - name: Weather & Meteorology
    enabled: true
    priority: high
    description: Meteorological science, major extreme-weather events, rare atmospheric phenomena, weather
      radar, satellites, forecasting advances, and meaningful Minnesota/Midwest storms. No daily forecast feed
      or political climate debate.
    keywords:
      - tornadoes and derechos
      - hurricanes and atmospheric rivers
      - blizzards and ice storms
      - rare clouds and optical phenomena
      - radar and weather satellite technology
      - forecasting research
      - Minnesota severe weather
    avoid:
      - climate-policy arguments and political commentary
      - sensationalized predictions
      - routine day-to-day forecasts
      - unsupported storm claims
    sources:
      - name: Google News severe weather science
        url: https://news.google.com/rss/search?q=%22severe+weather%22+%22research%22+OR+%22meteorology%22+%22forecast%22&hl=en-US&gl=US&ceid=US:en
      - name: Google News unusual weather
        url: https://news.google.com/rss/search?q=%22rare+weather%22+OR+%22atmospheric+phenomenon%22+OR+%22unusual+cloud%22&hl=en-US&gl=US&ceid=US:en
      - name: Google News major storms
        url: https://news.google.com/rss/search?q=%22tornado%22+OR+%22derecho%22+OR+%22blizzard%22+OR+%22atmospheric+river%22&hl=en-US&gl=US&ceid=US:en
      - name: Google News Minnesota and Midwest weather
        url: https://news.google.com/rss/search?q=%22Minnesota%22+%22severe+weather%22+OR+%22Midwest%22+%22winter+storm%22&hl=en-US&gl=US&ceid=US:en
      - name: Google News NOAA weather science
        url: https://news.google.com/rss/search?q=%22NOAA%22+%22weather+radar%22+OR+%22weather+satellite%22+OR+%22forecast+model%22&hl=en-US&gl=US&ceid=US:en
