name: Curate news with Gemini (free tier)

on:
  schedule:
    # Three editions daily in Chicago local time, including DST.
    - cron: "43 6,12,17 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-main
  cancel-in-progress: false

jobs:
  curate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Curate from sanitized pool
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -I curator/curate.py

      - name: Validate and build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          python3 -I check_picks.py
          python3 -I build_feed.py

      - name: Commit selected stories
        run: |
          git config user.name "curiosity-editor"
          git config user.email "curiosity-editor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new stories to commit."
            exit 0
          fi
          git commit -m "Curate stories $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase origin main
          git push origin main

  publish:
    needs: curate
    if: success()
    uses: ./.github/workflows/publish.yml
