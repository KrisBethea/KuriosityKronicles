name: Curate news with Gemini (free tier)

on:
  schedule:
    # 06:43, 12:43, 17:43 America/Chicago, including daylight saving.
    # Six candidate UTC hours; the local-hour guard permits only the right three.
    - cron: "43 11,12,17,18,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-main
  cancel-in-progress: false

jobs:
  curate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      publish_due: ${{ steps.hour.outputs.run }}
    steps:
      - name: Check local publishing hour
        id: hour
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [[ "$hour" == "06" || "$hour" == "12" || "$hour" == "17" ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
          echo "Chicago local hour: $hour"

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.hour.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Curate from sanitized pool
        if: github.event_name == 'workflow_dispatch' || steps.hour.outputs.run == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -I curator/curate.py

      - name: Validate and build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        if: github.event_name == 'workflow_dispatch' || steps.hour.outputs.run == 'yes'
        run: |
          python3 -I check_picks.py
          python3 -I build_feed.py

      - name: Commit selected stories
        if: github.event_name == 'workflow_dispatch' || steps.hour.outputs.run == 'yes'
        run: |
          git config user.name "curiosity-editor"
          git config user.email "curiosity-editor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new stories to commit."
            exit 0
          fi
          git commit -m "Curate stories $(TZ=America/Chicago date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase origin main
          git push origin main

  publish:
    needs: curate
    if: success() && (github.event_name == 'workflow_dispatch' || needs.curate.outputs.publish_due == 'yes')
    uses: ./.github/workflows/publish.yml
