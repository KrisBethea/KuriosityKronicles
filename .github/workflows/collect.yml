name: Collect feeds

# Pulls the RSS feeds in collector/sources.txt into candidates.json.
# No AI, no secrets. The scheduled curator picks from candidates.json.

on:
  schedule:
    - cron: "17 */4 * * *"    # every four hours (UTC)
  workflow_dispatch:          # the "Run workflow" button

permissions:
  contents: write             # push to this repo only

concurrency:
  group: news-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the sanitiser
        run: python3 -I collector/test_sanitise.py

      - name: Pull feeds
        run: python3 -I collector/collect.py

      - name: Commit candidates
        run: |
          # ignore the timestamp line so an unchanged pool makes no commit
          if git diff --quiet -I '"generated"' -- candidates.json submit.txt collector/held.json; then
            echo "No change."
            exit 0
          fi
          n=$(python3 -c "import json;print(json.load(open('candidates.json'))['count'])")
          git config user.name "neat-collector"
          git config user.email "neat-collector@users.noreply.github.com"
          git add candidates.json submit.txt collector/held.json
          git commit -m "Collect feeds: $n candidates"
          git pull --rebase origin main
          git push
